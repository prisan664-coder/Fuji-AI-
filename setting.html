<!DOCTYPE html>
<html lang="lo">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ຕັ້ງຄ່າ - Fuji Smart AI v6.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f141e;
            --bg-header: #131a26;
            --bg-card: #182232;
            --bg-card-hover: #1f2c40;
            --border-color: #263449;
            --accent-cyan: #22d3ee;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --accent-rose: #f43f5e;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }

        body.bw-mode {
            filter: grayscale(100%) contrast(1.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Lao', 'Noto Sans Thai', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .top-header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid rgba(34, 211, 238, 0.45);
            color: var(--accent-cyan);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.25);
        }

        .header-title h1 {
            font-size: 1.1rem;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .section-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin: 0 0 8px 8px;
            font-weight: 600;
        }

        .settings-group {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 22px;
        }

        .setting-row {
            width: 100%;
            background: none;
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .setting-row:last-child {
            border-bottom: none;
        }

        .setting-row:hover {
            background: var(--bg-card-hover);
        }

        .row-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .row-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .row-text h3 {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .row-text p {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .switch {
            position: relative;
            width: 48px;
            height: 26px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background-color: #2c3b52;
            border-radius: 34px;
            transition: 0.25s;
        }

        .slider:before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: #fff;
            border-radius: 50%;
            transition: 0.25s;
        }

        input:checked+.slider {
            background-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.5);
        }

        input:checked+.slider:before {
            transform: translateX(22px);
            background-color: #0b111a;
        }

        .badge {
            background: rgba(34, 211, 238, 0.14);
            color: var(--accent-cyan);
            border: 1px solid rgba(34, 211, 238, 0.35);
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.25), 0 0 24px rgba(168, 85, 247, 0.25);
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(7, 11, 18, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50;
        }

        .modal-bg.open {
            display: flex;
        }

        .modal-card {
            background: #162030;
            border: 1px solid #2b3d59;
            border-radius: 18px;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-top h3 {
            color: var(--accent-cyan);
            font-size: 1rem;
        }

        .modal-close {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
        }

        .lang-choice {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            font-size: 0.92rem;
        }

        .lang-choice.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: rgba(34, 211, 238, 0.12);
            font-weight: 600;
        }

        .modal-body {
            font-size: 0.88rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .modal-body p {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <header class="top-header">
        <a href="index.html" class="back-btn" aria-label="ກັບໄປໜ້າຫຼັກ">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M19 12H5"></path>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <div class="header-title">
            <h1 data-i18n="title">ຕັ້ງຄ່າລະບົບ</h1>
            <p data-i18n="subtitle">ຈັດການຕັ້ງຄ່າລະບົບຜູ້ຊ່ວຍແອດມິນເອໄອຂອງທ່ານຕາມການໃຊ້ງານຕ່າງຕ່າງໄດ້ຕາມທີເຈົ້າຕ້ອງການ...
            </p>
        </div>
    </header>

    <main class="container">
        <div class="section-label" data-i18n="secDisplay">ການສະແດງຜົນ ແລະ ພາສາ</div>
        <div class="settings-group">
            <!-- โหมดขาวดำ -->
            <div class="setting-row">
                <div class="row-left">
                    <div class="row-icon" style="background: rgba(241, 245, 249, 0.12); color: #f8fafc;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M12 3a9 9 0 0 0 0 18V3z" fill="currentColor"></path>
                        </svg>
                    </div>
                    <div class="row-text">
                        <h3 data-i18n="bwTitle">ໂໝດຂາວ-ດຳ</h3>
                        <p data-i18n="bwSub">ປ່ຽນໜ້າຫຼັກ ເປັນໂໝດສີຂາວ-ດຳ</p>
                    </div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="bwToggle" onchange="toggleBWMode(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- ໂຫມດປິດສຽງ -->
            <div class="setting-row">
                <div class="row-left">
                    <div class="row-icon" style="background: rgba(244, 63, 94, 0.15); color: #fb7185;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                    </div>
                    <div class="row-text">
                        <h3 data-i18n="audioTitle">ສຽງແຈ້ງເຕືອນ</h3>
                        <p data-i18n="audioSub">ເປີດ/ປິດ ສຽງ effect ໃນໜ້າຫຼັກ</p>
                    </div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="audioToggle" onchange="toggleAudio(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- ຟັງຊັ່ນປ່ຽນພາສາ -->
            <button type="button" class="setting-row" onclick="openModal('langModal')">
                <div class="row-left">
                    <div class="row-icon" style="background: rgba(34, 211, 238, 0.15); color: #22d3ee;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path
                                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                            </path>
                        </svg>
                    </div>
                    <div class="row-text">
                        <h3 data-i18n="langTitle">ປ່ຽນພາສາລະບົບ</h3>
                        <p data-i18n="langSub">ປ່ຽນພາສາຂອງໜ້າຫຼັກ ແລະ ໜ້າຕັ້ງຄ່າ</p>
                    </div>
                </div>
                <span class="badge" id="langBadge">ລາວ</span>
            </button>
        </div>

        <div class="section-label" data-i18n="secActions">ການຈັດການ</div>
        <div class="settings-group">
            <!-- Reset Session -->
            <button type="button" class="setting-row" onclick="resetSession()">
                <div class="row-left">
                    <div class="row-icon" style="background: rgba(244, 63, 94, 0.15); color: #f43f5e;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                            <path d="M10 11v6"></path>
                            <path d="M14 11v6"></path>
                            <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </div>
                    <div class="row-text">
                        <h3 data-i18n="resetTitle">ລ້າງຂໍ້ຄວາມແຊັດ</h3>
                        <p data-i18n="resetSub">ລຶບປະຫວັດການສົນທະນາ ແລະ ເລີ່ມໃໝ່</p>
                    </div>
                </div>
                <span style="color:#f43f5e;">›</span>
            </button>

            <!-- อัปเดตซอฟต์แวร์ -->
            <button type="button" class="setting-row" onclick="forceUpdate()">
                <div class="row-left">
                    <div class="row-icon" style="background: rgba(34, 211, 238, 0.15); color: #22d3ee;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 2v6h-6"></path>
                            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                            <path d="M3 22v-6h6"></path>
                            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                        </svg>
                    </div>
                    <div class="row-text">
                        <h3 data-i18n="updateTitle">ອັບເດດຊອບແວ</h3>
                        <p data-i18n="updateSub">ໂຫຼດໜ້າຈໍໃໝ່ ເພື່ອຮັບເວີຊັນລ່າສຸດ</p>
                    </div>
                </div>
                <span class="badge" id="appVersion">v6.0</span>
            </button>
        </div>

        <div class="section-label" data-i18n="secInfo">ຂໍ້ມູນລະບົບ</div>
        <div class="settings-group">
            <button type="button" class="setting-row" onclick="openModal('guideModal')">
                <div class="row-left">
                    <div class="row-icon" style="background: rgba(168, 85, 247, 0.15); color: #a855f7;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                        </svg>
                    </div>
                    <div class="row-text">
                        <h3 data-i18n="guideTitle">ຄູ່ມືການໃຊ້ງານ</h3>
                        <p data-i18n="guideSub">ຄຳແນະນຳການໃຊ້ງານລະບົບແອດມິນ AI</p>
                    </div>
                </div>
                <span style="color:#94a3b8;">›</span>
            </button>

            <button type="button" class="setting-row" onclick="openModal('aboutModal')">
                <div class="row-left">
                    <div class="row-icon" style="background: rgba(16, 185, 129, 0.15); color: #10b981;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                    </div>
                    <div class="row-text">
                        <h3 data-i18n="aboutTitle">ກ່ຽວກັບ (About)</h3>
                        <p data-i18n="aboutSub">ແອດມິນເອໄອ ຮ້ານແປງໂທລະສັບຟູຈິ v6.0</p>
                    </div>
                </div>
                <span style="color:#94a3b8;">›</span>
            </button>
        </div>

        <a href="index.html" class="home-btn">
            <span data-i18n="backHome">ກັບໄປໜ້າແລກ (index.html)</span>
        </a>
    </main>

    <!-- Modal เลือกภาษา -->
    <div id="langModal" class="modal-bg" onclick="closeOnBg(event, 'langModal')">
        <div class="modal-card">
            <div class="modal-top">
                <h3 data-i18n="langTitle">ປ່ຽນພາສາລະບົບ</h3>
                <button type="button" class="modal-close" onclick="closeModal('langModal')">✕</button>
            </div>
            <button type="button" class="lang-choice" id="choice-lo" onclick="selectLang('lo')">
                <span>🇱🇦 ພາສາລາວ</span><span></span>
            </button>
            <button type="button" class="lang-choice" id="choice-th" onclick="selectLang('th')">
                <span>🇹🇭 ภาษาไทย</span><span></span>
            </button>
            <button type="button" class="lang-choice" id="choice-en" onclick="selectLang('en')">
                <span>🇺🇸 English</span><span></span>
            </button>
        </div>
    </div>

    <!-- Modal คู่มือ -->
    <div id="guideModal" class="modal-bg" onclick="closeOnBg(event, 'guideModal')">
        <div class="modal-card">
            <div class="modal-top">
                <h3 data-i18n="guideTitle">ຄູ່ມືການໃຊ້ງານ</h3>
                <button type="button" class="modal-close" onclick="closeModal('guideModal')">✕</button>
            </div>
            <div class="modal-body" id="guideText"></div>
        </div>
    </div>

    <!-- Modal เกี่ยวกับ -->
    <div id="aboutModal" class="modal-bg" onclick="closeOnBg(event, 'aboutModal')">
        <div class="modal-card">
            <div class="modal-top">
                <h3 data-i18n="aboutTitle">ກ່ຽວກັບ</h3>
                <button type="button" class="modal-close" onclick="closeModal('aboutModal')">✕</button>
            </div>
            <div class="modal-body" id="aboutText"></div>
        </div>
    </div>

    <script>
        const SETTINGS_KEYS = {
            BW: 'fuji_bw_mode',
            AUDIO: 'fuji_audio',
            LANG: 'fuji_system_lang',
            RESET: 'fuji_reset_requested'
        };

        const i18nData = {
            lo: {
                badge: "ລາວ",
                title: "ຕັ້ງຄ່າລະບົບ",
                subtitle: "ຄວບຄຸມການສະແດງຜົນຂອງໜ້າຫຼັກ ",
                secDisplay: "ການສະແດງຜົນ ແລະ ພາສາ",
                bwTitle: "ໂໝດຂາວ-ດຳ",
                bwSub: "ປ່ຽນໜ້າຫຼັກ  ເປັນໂໝດສີຂາວ-ດຳ",
                audioTitle: "ສຽງແຈ້ງເຕືອນ",
                audioSub: "ເປີດ/ປິດ ສຽງ effect ໃນໜ້າຫຼັກ",
                langTitle: "ປ່ຽນພາສາລະບົບ",
                langSub: "ປ່ຽນພາສາຂອງໜ້າຫຼັກ ແລະ ໜ້າຕັ້ງຄ່າ",
                secActions: "ການຈັດການ",
                resetTitle: "ລ້າງຂໍ້ຄວາມແຊັດ",
                resetSub: "ລຶບປະຫວັດການສົນທະນາ ແລະ ເລີ່ມໃໝ່",
                updateTitle: "ອັບເດດຊອບແວ",
                updateSub: "ໂຫຼດໜ້າຈໍໃໝ່ ເພື່ອຮັບເວີຊັນລ່າສຸດ",
                secInfo: "ຂໍ້ມູນລະບົບ",
                guideTitle: "ຄູ່ມືການໃຊ້ງານ",
                guideSub: "ຄຳແນະນຳການໃຊ້ງານລະບົບແອດມິນ AI",
                aboutTitle: "ກ່ຽວກັບ (About)",
                aboutSub: "ແອດມິນເອໄອ ຮ້ານແປງໂທລະສັບຟູຈິ v6.0",
                backHome: "ກັບໄປໜ້າແລກ ",

        // ===== APPLY SAVED SETTINGS =====
        function applySavedSettings() {
            // โหมดขาวดำ
            const bwOn = localStorage.getItem(SETTINGS_KEYS.BW) === '1';
            document.getElementById('bwToggle').checked = bwOn;
            document.body.classList.toggle('bw-mode', bwOn);

            // เสียง
            const audioOn = localStorage.getItem(SETTINGS_KEYS.AUDIO) !== 'false';
            document.getElementById('audioToggle').checked = audioOn;
        }

        // ===== TOGGLES =====
        function toggleBWMode(enabled) {
            localStorage.setItem(SETTINGS_KEYS.BW, enabled ? '1' : '0');
            document.body.classList.toggle('bw-mode', enabled);
            showToast(enabled ? '⚫ ໂໝດຂາວ-ດຳ ເປີດ' : '⚪ ໂໝດປົກກະຕິ');
        }

        function toggleAudio(enabled) {
            localStorage.setItem(SETTINGS_KEYS.AUDIO, enabled ? 'true' : 'false');
            showToast(enabled ? '🔊 ເປີດສຽງ' : '🔇 ປິດສຽງ');
        }

        // ===== LANGUAGE =====
        function selectLang(lang) {
            localStorage.setItem(SETTINGS_KEYS.LANG, lang);
            applyLang(lang);
            closeModal('langModal');
            showToast('🌐 ' + (i18nData[lang]?.badge || ''));
        }

        function applyLang(lang) {
            const d = i18nData[lang] || i18nData.lo;
            document.getElementById('langBadge').textContent = d.badge;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (d[k]) el.textContent = d[k];
            });
            document.getElementById('guideText').innerHTML = d.guide;
            document.getElementById('aboutText').innerHTML = d.about;

            ['lo', 'th', 'en'].forEach(code => {
                const btn = document.getElementById('choice-' + code);
                btn.classList.toggle('active', code === lang);
                btn.lastElementChild.textContent = code === lang ? '✓' : '';
            });
        }

        // ===== MODAL =====
        function openModal(id) {document.getElementById(id).classList.add('open');}
        function closeModal(id) {document.getElementById(id).classList.remove('open');}
        function closeOnBg(e, id) {if (e.target.id === id) closeModal(id);}

        // ===== RESET SESSION =====
        function resetSession() {
            if (!confirm('ລ້າງຂໍ້ຄວາມທັງໝົດ ແລະ ເລີ່ມແຊັດໃໝ່?\n(ຈະກັບໄປໜ້າຫຼັກ ແລະ ລຶບປະຫວັດ)')) return;
            localStorage.setItem(SETTINGS_KEYS.RESET, '1');
            showToast('🔄 ກຳລັງລ້າງແຊັດ...');
            setTimeout(() => {window.location.href = 'index.html';}, 600);
        }

        // ===== FORCE UPDATE =====
        async function forceUpdate() {
            if (!confirm('ອັບເດດຊອບແວ?\nໜ້າຈະໂຫຼດໃໝ່.')) return;
            try {
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(k => caches.delete(k)));
                }
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(r => r.update()));
                }
                location.reload(true);
            } catch (e) {
                location.reload();
            }
        }

        // ===== TOAST =====
        let toastTimer = null;
        function showToast(msg) {
            let toast = document.getElementById('settings-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'settings-toast';
                toast.style.cssText = `
                    position: fixed; top: 20px; right: 20px;
                    background: rgba(15, 23, 42, 0.95);
                    border: 1px solid rgba(34, 211, 238, 0.4);
                    color: #f1f5f9;
                    padding: 10px 16px; border-radius: 12px;
                    font-size: 0.85rem; font-weight: 500;
                    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
                    z-index: 999; opacity: 0;
                    transform: translateY(-20px);
                    transition: all 0.3s;
                    max-width: 85vw;
                `;
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            requestAnimationFrame(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateY(0)';
            });
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
            }, 2000);
        }

        // ===== INIT =====
        applySavedSettings();
        applyLang(localStorage.getItem(SETTINGS_KEYS.LANG) || 'lo');

        // แสดงเวอร์ชัน
        document.getElementById('appVersion').textContent =
            localStorage.getItem('fuji_app_version') || 'v6.0';
    </script>
